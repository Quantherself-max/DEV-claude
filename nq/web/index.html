<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NQ Scalp Terminal</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top">
  <div class="brand">NQ<span> SCALP</span></div>
  <div class="contract"><b id="contract">NQ</b><small id="roll"></small></div>
  <div class="price"><b id="price">—</b><small id="atr"></small></div>
  <div class="seg" id="tfs" role="group" aria-label="Unité de temps"></div>
  <div class="clocks" title="Heure de Paris · heure de New York (ET)">
    <span><i>Paris</i> <b id="clkParis">--:--:--</b></span>
    <span><i>NY</i> <b id="clkEt">--:--:--</b></span>
  </div>
  <div class="phase"><b id="phase">—</b><small id="nextMark"></small></div>
  <div class="spacer"></div>
  <button id="oiChip" class="badge" title="Intérêt ouvert du NQ (écrit par NQTickLogger)">OI —</button>
  <button id="gexChip" class="badge" title="GEX des options (différé) : régime et zéro gamma">GEX —</button>
  <button id="acctChip" class="badge" title="État du compte Lucid : marge avant le plancher">Compte —</button>
  <button id="srcBadge" class="badge" title="Source des données">source —</button>
</header>
<div id="banner" hidden></div>

<nav id="viewbar">
  <div id="views" role="tablist" aria-label="Vues"></div>
  <button id="addView" class="ghost" title="Nouvelle vue (copie de la vue active) : autre unité de temps, autres indicateurs">＋ Vue</button>
  <div class="spacer"></div>
  <button id="indBtn" title="Choisir ce qui s'affiche sur le graphique de cette vue">▦ Indicateurs</button>
  <button id="addChart" title="Ajouter un petit graphique (autre unité de temps) sous le graphique principal, 3 au plus">＋ Graphique</button>
  <button id="drawerBtn" title="Lecture, setups, niveaux, GEX / OI, compte Lucid, plan, backtest, footprint, source">☰ Outils</button>
</nav>

<main>
  <section id="chartcol">
    <div id="pricewrap">
      <div id="price-chart"></div>
      <canvas id="overlay"></canvas>
      <div id="legend"></div>
    </div>
    <div id="cvd-chart"></div>
    <div id="multi" hidden></div>
  </section>

  <aside id="side" hidden>
    <nav id="tabs" class="tabs" role="tablist">
      <button data-tab="lecture" class="on">Lecture</button>
      <button data-tab="setups">Setups</button>
      <button data-tab="levels">Niveaux</button>
      <button data-tab="gex">GEX / OI</button>
      <button data-tab="account">Compte</button>
      <button data-tab="plan">Plan</button>
      <button data-tab="backtest">Backtest</button>
      <button data-tab="fp">Footprint</button>
      <button data-tab="source">Source</button>
      <button id="drawerClose" class="x" title="Fermer">✕</button>
    </nav>
    <div id="tab-lecture" class="tabpage"></div>
    <div id="tab-setups" class="tabpage" hidden></div>
    <div id="tab-levels" class="tabpage" hidden></div>
    <div id="tab-gex" class="tabpage" hidden></div>
    <div id="tab-account" class="tabpage" hidden></div>
    <div id="tab-plan" class="tabpage" hidden></div>
    <div id="tab-backtest" class="tabpage" hidden></div>
    <div id="tab-fp" class="tabpage" hidden></div>
    <div id="tab-source" class="tabpage" hidden></div>
  </aside>
</main>

<div id="indPanel" class="popover" hidden>
  <div class="pophead"><input id="indFilter" placeholder="Rechercher un indicateur…" autocomplete="off"><button id="indClose" class="x" title="Fermer">✕</button></div>
  <div id="indBody"></div>
</div>
<div id="toast" hidden></div>

<script src="vendor/lightweight-charts.standalone.production.js"></script>
<script src="util.js"></script>
<script src="chart.js"></script>
<script src="panels.js"></script>
<script src="minis.js"></script>
<script src="app.js"></script>
</body>
</html>
